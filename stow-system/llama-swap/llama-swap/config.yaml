# Configuration doc: https://github.com/mostlygeek/llama-swap/blob/main/docs/config.example.yaml

logLevel: debug
logToStdout: "both"

globalTTL: 600
includeAliasesInList: true

macros:
  "llama-base": >
    llama-server
      --port ${PORT}
      --log-verbosity 4

      # Saves 1.3 Gb VRAM, FOR FREE?
      --parallel 1

      # https://huggingface.co/froggeric/Qwen-Fixed-Chat-Templates
      --jinja
      --chat-template-file /var/lib/models/froggeric-chat_template.jinja
      --reasoning-format deepseek

      # TODO: Figure out switching reasoning effort per-prompt
      --reasoning_effort "low"
      --reasoning-preserve
  "llama-mtp": >
    ${llama-base}
      --spec-type draft-mtp
      --spec-draft-backend-sampling
      --spec-draft-n-max 2

  "sd-base": >
    sd-server
      --listen-port ${PORT}

# https://unsloth.ai/docs/models/qwen3.6#thinking-mode
x-qwen3-8-params: &qwen3-8-params
  filters:
    setParams:
      top_k: 20
      min_p: 0.0
      repetition_penalty: 1.0
      chat_template_kwargs:
        preserve_thinking: true

    setParamsByID:
      "${MODEL_ID}:Thinking Coding":
        temperature: 0.6
        top_p: 0.95
        presence_penalty: 0.0
        chat_template_kwargs:
          enable_thinking: true

      "${MODEL_ID}:Coding":
        temperature: 0.6
        top_p: 0.95
        presence_penalty: 0.0
        chat_template_kwargs:
          enable_thinking: false

      "${MODEL_ID}:Thinking":
        temperature: 1.0
        top_p: 0.95
        presence_penalty: 0.0
        chat_template_kwargs:
          enable_thinking: true

      "${MODEL_ID}":
        temperature: 0.7
        top_p: 0.8
        presence_penalty: 1.5
        chat_template_kwargs:
          enable_thinking: false

  aliases:
    - "${MODEL_ID}:Thinking Coding"
    - "${MODEL_ID}:Coding"
    - "${MODEL_ID}:Thinking"
    # - "${MODEL_ID}" # The base param set is expected to be Instruct

x-qwen3-6-params: &qwen3-6-params
  filters:
    setParams:
      top_k: 20
      min_p: 0.0
      repetition_penalty: 1.0

    setParamsByID:
      "${MODEL_ID}:Thinking":
        temperature: 1.0
        top_p: 0.95
        presence_penalty: 0.0
        chat_template_kwargs:
          enable_thinking: true

      "${MODEL_ID}:Coding":
        temperature: 0.6
        top_p: 0.95
        presence_penalty: 0.0
        chat_template_kwargs:
          enable_thinking: true

      "${MODEL_ID}":
        temperature: 0.7
        top_p: 0.8
        presence_penalty: 1.5
        chat_template_kwargs:
          enable_thinking: false

  aliases:
    - "${MODEL_ID}:Thinking"
    - "${MODEL_ID}:Coding"
    # - "${MODEL_ID}" # The base param set is expected to be Instruct

# Not assigning names to models so that
# Open WebUI uses id istead of names
# and aliases can be destinguished easier
models:
  # --------------------------------------------------------------------------------
  # Image
  # --------------------------------------------------------------------------------

  "Qwen-Image-2.1-VRAM":
    description:
      Image generation. The model fits into VRAM and works relatively fast
    cmd: |
      ${sd-base}
      --diffusion-model /var/lib/models/qwen-image-2.1/qwen-image-2.1-Q4_K_M.gguf
      --vae /var/lib/models/qwen-image-2.1/qwen_image_2.1_vae_bf16.safetensors
      --llm /var/lib/models/qwen-image-2.1/Qwen3-VL-8B-Instruct-UD-Q4_K_XL.gguf
      --diffusion-fa
      --steps 40
      --cfg-scale 6.0
      --sampling-method euler
    checkEndpoint: none

  "Z-Image-VRAM":
    description:
      Outdated image generation. The model fits into VRAM and works relatively fast
    cmd: |
      ${sd-base}
      --diffusion-model /var/lib/models/z-image-turbo/z-image-turbo-Q8_0.gguf
      --vae /var/lib/models/z-image-turbo/ae.safetensors
      --llm /var/lib/models/z-image-turbo/Qwen3-4B-Instruct-2507-Q8_0.gguf
      --diffusion-fa
      --vae-conv-direct
      --cfg-scale 1.0
      --steps 8
    checkEndpoint: none

  # --------------------------------------------------------------------------------
  # Qwen3.8 VRAM
  # --------------------------------------------------------------------------------

  "Qwen3.8-27B-VRAM-SMART":
    descriptions:
      The model is smarter but not much is left for context.
      Good for simple questions.
    cmd: |
      ${llama-mtp}
      -m /var/lib/models/Qwen3.8-27B-UD-IQ4_XS.gguf
      --gpu-layers all
      # 2^15 + 2^14
      --ctx-size 49152
      --cache-type-k q8_0
      --cache-type-v q4_0
    <<: *qwen3-8-params

  "Qwen3.8-27B-VRAM-WISE":
    descriptions:
      The model takes less space and thus can fit bigger context.
      Good for coding.
    cmd: |
      ${llama-mtp}
      -m /var/lib/models/Qwen3.8-27B-UD-IQ3_XXS.gguf
      --gpu-layers all
      # 2^17
      --ctx-size 131072
      --cache-type-k q8_0
      --cache-type-v q4_0
    <<: *qwen3-8-params

  # https://www.reddit.com/r/LocalLLaMA/s/L7cci70aK9
  "Qwen3.8-27B-VRAM-UNCENSORED":
    descriptions:
      The model takes less space and thus can fit bigger context.
      Fine-tuning hurts accuracy, good for tasks that really require uncensored results.
    cmd: |
      ${llama-mtp}
      --model /var/lib/models/Qwen3.8-27B-GSQ-RCO-IQ3_XXS-Uncensored-v1.1.gguf
      --gpu-layers all
      # 2^17
      --ctx-size 131072
      --cache-type-k q8_0
      --cache-type-v q4_0
    <<: *qwen3-8-params

  # --------------------------------------------------------------------------------
  # Qwen3.8 RAM
  # --------------------------------------------------------------------------------

  "Qwen3.8-27B-RAM":
    descriptions:
      The model does not fit into VRAM, full context
    cmd: |
      ${llama-mtp}
      -m /var/lib/models/Qwen3.8-27B-UD-Q8_K_XL.gguf
      --ctx-size 262144
      --cache-type-k q8_0
      --cache-type-v q8_0
    <<: *qwen3-8-params

  # --------------------------------------------------------------------------------
  # Qwen3.6 RAM
  # --------------------------------------------------------------------------------

  "Qwen3.6-35B-A3B-RAM":
    description: 
      The model does not fit into VRAM but the speed descrese
      is compensated by A3B and MTP
    cmd: |
      ${llama-mtp}
      # -m /var/lib/models/Qwen3.6-35B-A3B-UD-Q6_K_XL.gguf
      -m /var/lib/models/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
      # --ctx-size 131072
      --ctx-size 262144
      --cache-type-k q8_0
      --cache-type-v q8_0
    <<: *qwen3-6-params
