# Configuration doc: https://github.com/mostlygeek/llama-swap/blob/main/docs/config.example.yaml

logLevel: debug
logToStdout: "both"

globalTTL: 600
includeAliasesInList: true

macros:
  "default-llama": >
    llama-server --port ${PORT} --log-verbosity 4
  "default-sd": >
    sd-server --listen-port ${PORT}

# https://unsloth.ai/docs/models/qwen3.6#thinking-mode
x-qwen3-8-params: &qwen3-8-params
  filters:
    setParams:
      top_k: 20
      min_p: 0.0
      repetition_penalty: 1.0
      chat_template_kwargs:
        preserve_thinking: true

    setParamsByID:
      "${MODEL_ID}:Thinking Coding":
        temperature: 0.6
        top_p: 0.95
        presence_penalty: 0.0
        chat_template_kwargs:
          enable_thinking: true

      "${MODEL_ID}:Coding":
        temperature: 0.6
        top_p: 0.95
        presence_penalty: 0.0
        chat_template_kwargs:
          enable_thinking: false

      "${MODEL_ID}:Thinking":
        temperature: 1.0
        top_p: 0.95
        presence_penalty: 0.0
        chat_template_kwargs:
          enable_thinking: true

      "${MODEL_ID}":
        temperature: 0.7
        top_p: 0.8
        presence_penalty: 1.5
        chat_template_kwargs:
          enable_thinking: false

  aliases:
    - "${MODEL_ID}:Thinking Coding"
    - "${MODEL_ID}:Coding"
    - "${MODEL_ID}:Thinking"
    # - "${MODEL_ID}" # The base param set is expected to be Instruct

x-qwen3-6-params: &qwen3-6-params
  filters:
    setParams:
      top_k: 20
      min_p: 0.0
      repetition_penalty: 1.0

    setParamsByID:
      "${MODEL_ID}:Thinking":
        temperature: 1.0
        top_p: 0.95
        presence_penalty: 0.0
        chat_template_kwargs:
          enable_thinking: true

      "${MODEL_ID}:Coding":
        temperature: 0.6
        top_p: 0.95
        presence_penalty: 0.0
        chat_template_kwargs:
          enable_thinking: true

      "${MODEL_ID}":
        temperature: 0.7
        top_p: 0.8
        presence_penalty: 1.5
        chat_template_kwargs:
          enable_thinking: false

  aliases:
    - "${MODEL_ID}:Thinking"
    - "${MODEL_ID}:Coding"
    # - "${MODEL_ID}" # The base param set is expected to be Instruct

# Not assigning names to models so that
# Open WebUI uses id istead of names
# and aliases can be destinguished easier
models:
  "Qwen-Image-2.1-VRAM-FAST":
    description:
      Image generation. The model fits into VRAM and works relatively fast
    cmd: |
      ${default-sd}
      --diffusion-model /var/lib/models/qwen-image-2.1/qwen-image-2.1-Q4_K_M.gguf
      --vae /var/lib/models/qwen-image-2.1/qwen_image_2.1_vae_bf16.safetensors
      --llm /var/lib/models/qwen-image-2.1/Qwen3-VL-8B-Instruct-UD-Q4_K_XL.gguf
      --diffusion-fa
      --steps 40
      --cfg-scale 6.0
      --sampling-method euler
    checkEndpoint: none

  "Z-Image-VRAM-FAST":
    description:
      Outdated image generation. The model fits into VRAM and works relatively fast
    cmd: |
      ${default-sd}
      --diffusion-model /var/lib/models/z-image-turbo/z_image_turbo-Q8_0.gguf
      --vae /var/lib/models/z-image-turbo/ae.safetensors
      --llm /var/lib/models/z-image-turbo/Qwen3-4B-Instruct-2507-Q8_0.gguf
      --diffusion-fa
      --vae-conv-direct
      --cfg-scale 1.0
      --steps 8
    checkEndpoint: none

  "Qwen3.8-27B-RAM":
    descriptions:
      The model does not fit into VRAM
    cmd: |
      ${default-llama}
      -m /var/lib/models/Qwen3.8-27B-UD-IQ4_XS.gguf
      --ctx-size 131072
      --cache-type-k q8_0
      --cache-type-v q4_0
      --spec-type draft-mtp
      --spec-draft-n-max 2
      # Pi does not send `reasoning_effort` for some reason
      # and llama-swap does not even apply it
      --chat-template-kwargs '{"reasoning_effort":"low"}'
      # Does not work for some reason
      # --chat-template-kwargs '{"preserve_thinking":true}'
      --reasoning-preserve
    <<: *qwen3-8-params

  "Qwen3.8-27B-VRAM-FAST":
    descriptions:
      The absence of K/V cache quantization results in very good TTFT
      but a big context window does not fit.
      Good for simple questions.

      The model barely fits into VRAM and might require switching
      to an integrated GPU for graphics
    cmd: |
      ${default-llama}
      # Technically fits but WM freezes and llama then crashes
      # -m /var/lib/models/Qwen3.8-27B-UD-IQ4_XS.gguf
      -m /var/lib/models/Qwen3.8-27B-UD-IQ3_XXS.gguf
      --gpu-layers all
      --ctx-size 32768
      --spec-type draft-mtp
      --spec-draft-n-max 2
      # Pi does not send `reasoning_effort` for some reason
      # and llama-swap does not even apply it
      --chat-template-kwargs '{"reasoning_effort":"low"}'
      # Does not work for some reason
      # --chat-template-kwargs '{"preserve_thinking":true}'
      --reasoning-preserve
    <<: *qwen3-8-params

  "Qwen3.8-27B-VRAM-WISE":
    descriptions:
      The presence of K/V cache quantization allows to fit a larger context window
      but it hurts TTFT by a lot.
      Good for coding.

      The model barely fits into VRAM and might require switching
      to an integrated GPU for graphics
    cmd: |
      ${default-llama}
      -m /var/lib/models/Qwen3.8-27B-UD-IQ3_XXS.gguf
      --gpu-layers all
      --ctx-size 131072
      # Does not fit
      # --cache-type-k f16 
      # --cache-type-v q8_0
      # Why this when q8_0/q8_0 fits as well
      # --cache-type-k q8_0
      # --cache-type-v q4_0
      --cache-type-k q8_0
      --cache-type-v q8_0
      # Does not fit
      # --spec-type draft-mtp
      # --spec-draft-n-max 2
      # Pi does not send `reasoning_effort` for some reason
      # and llama-swap does not even apply it
      --chat-template-kwargs '{"reasoning_effort":"low"}'
      # Does not work for some reason
      # --chat-template-kwargs '{"preserve_thinking":true}'
      --reasoning-preserve
    <<: *qwen3-8-params

  "Qwen3.6-35B-A3B-RAM":
    description: 
      The model does not fit into VRAM but the speed descrese
      is compensated by A3B and MTP
    cmd: |
      ${default-llama}
      # -m /var/lib/models/Qwen3.6-35B-A3B-UD-Q6_K_XL.gguf
      -m /var/lib/models/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
      # --ctx-size 131072
      --ctx-size 262144
      # --fit off
      # --gpu-layers all
      # --cpu-moe
      # --override-tensor "\.ffn_(up|down|gate|gate_up)_(ch|)exps=CPU"
      --cache-type-k q8_0
      --cache-type-v q8_0
      --spec-type draft-mtp
      --spec-draft-n-max 2
      # Pi does not send `reasoning_effort` for some reason
      # and llama-swap does not even apply it
      --chat-template-kwargs '{"reasoning_effort":"low"}'
      # Does not work for some reason
      # --chat-template-kwargs '{"preserve_thinking":true}'
      --reasoning-preserve
    <<: *qwen3-6-params
